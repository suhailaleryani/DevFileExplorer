name: Publish guide site

# Publishes the static site in docs/ with GitHub Pages.
# Needs: Settings > Pages > Source = "GitHub Actions". See docs/publish-guide.md.
on:
  # Manual until GitHub Pages is enabled. After enabling it (Settings > Pages > Source = GitHub Actions),
  # add this trigger back to publish automatically on every change to docs/:
  #   push:
  #     branches: [main]
  #     paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
